spring.application.name=cafe-java
spring.profiles.default=mysql
server.address=127.0.0.1
server.port=${PORT:8081}
spring.sql.init.mode=always
spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.use-last-modified=false
cafe.menu-json=${CAFE_MENU_JSON:classpath:menu-original.json}
cafe.fiscal.entorno=SIMULACION
cafe.fiscal.razon-social=Cafe Positivo
cafe.fiscal.cuit=${CAFE_CUIT:}
cafe.fiscal.domicilio=${CAFE_DOMICILIO:}
cafe.fiscal.condicion-iva=IVA EXENTO
cafe.fiscal.tipo-factura=C
cafe.fiscal.punto-venta=8
cafe.fiscal.alicuota-iva=0
cafe.impresion.habilitada=${CAFE_IMPRESION_HABILITADA:false}
cafe.impresion.automatica=${CAFE_IMPRESION_AUTOMATICA:false}
cafe.impresion.nombre=${CAFE_IMPRESORA:}
